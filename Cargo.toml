[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Sigma-studios/replique"

# Versions shared by several crates. Each crate still lists what it uses.
[workspace.dependencies]
replique-proto = { path = "crates/replique-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
url = "2"
